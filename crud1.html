    <div class="container">
        <!--Creación de crud para un planificador de presupuesto, como mencioné anteriormente, hace uso del local storage :D-->
        <h1>Planificador de Presupuesto</h1>

        <div class="form-group">
            <label for="ingreso">Ingreso Mensual:</label>
            <input type="number" id="ingreso" placeholder="Ingrese su ingreso">
        </div>

        <div class="form-group">
            <label for="categoria">Categoría de Gasto:</label>
            <select id="categoria">
                <option value="Alimentación">Alimentación</option>
                <option value="Transporte">Transporte</option>
                <option value="Vivienda">Vivienda</option>
                <option value="Entretenimiento">Entretenimiento</option>
                <option value="Otros">Otros</option>
            </select>
        </div>

        <div class="form-group">
            <label for="monto">Monto del Gasto:</label>
            <input type="number" id="monto" placeholder="Ingrese el monto">
        </div>

        <button id="btnAgregar">Agregar Gasto</button>

        <h2>Lista de Gastos</h2>
        <div id="listaGastos"></div>

        <h2>Resumen</h2>
        <p id="totalGastos">Total Gastos: $0</p>
        <p id="saldoRestante">Saldo Restante: $0</p>
    </div>

    <script>
        let ingresoMensual = parseFloat(localStorage.getItem("ingresoMensual")) || 0;
        let gastos = JSON.parse(localStorage.getItem("gastos")) || [];

        function actualizarResumen() {
            let totalGastos = gastos.reduce((sum, gasto) => sum + gasto.monto, 0);
            if (ingresoMensual <= 0) {
                ingresoMensual = 0;

                let saldoRestante = ingresoMensual - totalGastos;

                document.getElementById("totalGastos").innerText = `Total Gastos: $${totalGastos}`;
                document.getElementById("saldoRestante").innerText = `Saldo Restante: $${saldoRestante >= 0 ? saldoRestante : 0}`;
            }}

            document.getElementById("btnAgregar").addEventListener("click", function () {
                let categoria = document.getElementById("categoria").value;
                let monto = parseFloat(document.getElementById("monto").value);

                if (isNaN(monto) || monto <= 0) {
                    alert("Ingrese un monto válido.");
                    return;
                }

                let nuevoGasto = { id: Date.now(), categoria: categoria, monto: monto };
                gastos.push(nuevoGasto);
                localStorage.setItem("gastos", JSON.stringify(gastos));
                actualizarResumen();
                mostrarGastos();
            });

            function mostrarGastos() {
                let lista = document.getElementById("listaGastos");
                lista.innerHTML = "";

                gastos.forEach((item, index) => {
                    let div = document.createElement("div");
                    div.innerHTML = `${item.categoria}: $${item.monto} 
            <button onclick="eliminarGasto(${item.id})">Eliminar</button>`;
                    lista.appendChild(div);
                });
            }
            function eliminarGasto(id) {
                gastos = gastos.filter(item => item.id !== id);
                localStorage.setItem("gastos", JSON.stringify(gastos));
                actualizarResumen();
                mostrarGastos();
            }

            document.addEventListener("DOMContentLoaded", function () {
                mostrarGastos();
                actualizarResumen();
            });

    </script>
