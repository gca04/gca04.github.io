    <content>
    <div id="wrapper" >
        <h2> Ingrese su rut sin puntos y con guión</h2>
      <p>&nbsp;</p>
      <div class="input-group input-group-lg">
        <span class="input-group-addon" id="sizing-addon1"> Validación de Rut</span>
        <input type="text" class="form-control" placeholder="Rut a validar, ej: 11111111-1" aria-describedby="sizing-addon1" id="txt_rut">
      </div>
      <p>&nbsp;</p>
      <button id="btnvalida" class="btn btn-default">Validar RUT</button>
      <p>&nbsp;</p>
      <p class="text-info" id="msgerror"></p>
    </div>
  </content>

<input type="text" id="texto" placeholder="Ingrese texto">
<button onclick="mostrarTextoCifrado()">Encriptar</button>
<p id="resultado"></p>

<script>
var Fn = {
	validaRut : function (rutCompleto) {
		if (!/^[0-9]+[-|‐]{1}[0-9kK]{1}$/.test( rutCompleto ))
			return false;
		var tmp 	= rutCompleto.split('-');
		var digv	= tmp[1]; 
		var rut 	= tmp[0];
		if ( digv == 'K' ) digv = 'k' ;
		return (Fn.dv(rut) == digv );
	},
	dv : function(T){
		var M=0,S=1;
		for(;T;T=Math.floor(T/10))
			S=(S+T%10*(9-M++%6))%11;
		return S?S-1:'k';
	}
}

$("#btnvalida").click(function(){
  var rut = $("#txt_rut").val().trim();
  if (rut === "") {
    $("#msgerror").html("Por favor, ingrese un RUT.");
    return;
  }
  if (Fn.validaRut(rut)){
    $("#msgerror").html("El rut ingresado es válido :D");
  } else {
    $("#msgerror").html("El Rut no es válido :'( ");
  }
});

function mostrarTextoCifrado() {
    let texto = document.getElementById("texto").value;
    let cifrado = encriptarTexto(texto);
    document.getElementById("resultado").innerText = "Texto cifrado: " + cifrado;
}
function encriptarTexto(texto) {
    let clave = "miClaveSecreta";
    let textoCifrado = CryptoJS.AES.encrypt(texto, clave).toString();
    return textoCifrado;
}

function desencriptarTexto(textoCifrado) {
    let clave = "miClaveSecreta";
    let bytes = CryptoJS.AES.decrypt(textoCifrado, clave);
    let textoOriginal = bytes.toString(CryptoJS.enc.Utf8);
    return textoOriginal;
}

let textoUsuario = "Hola, este es un mensaje secreto";
let textoCifrado = encriptarTexto(textoUsuario);
console.log("Texto cifrado:", textoCifrado);

let textoDesencriptado = desencriptarTexto(textoCifrado);
console.log("Texto desencriptado:", textoDesencriptado);

</script>
