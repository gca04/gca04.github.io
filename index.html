        <span class="input-group-addon" id="sizing-addon1"> Validación de Rut</span>
        <input type="text" class="form-control" placeholder="Rut a validar, ej: 11111111-1" aria-describedby="sizing-addon1" id="txt_rut">

<script>
var Fn = {
	validaRut : function (rutCompleto) {
		if (!/^[0-9]+[-|‐]{1}[0-9kK]{1}$/.test( rutCompleto ))
			return false;
		var tmp 	= rutCompleto.split('-');
		var digv	= tmp[1]; 
		var rut 	= tmp[0];
		if ( digv == 'K' ) digv = 'k' ;
		return (Fn.dv(rut) == digv );
	},
	dv : function(T){
		var M=0,S=1;
		for(;T;T=Math.floor(T/10))
			S=(S+T%10*(9-M++%6))%11;
		return S?S-1:'k';
	}
}

$("#btnvalida").click(function(){
  if (Fn.validaRut( $("#txt_rut").val() )){
    $("#msgerror").html("El rut ingresado es válido :D");
  } else {
    $("#msgerror").html("El Rut no es válido :'( ");
  }
});
</script>
