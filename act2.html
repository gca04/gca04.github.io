 <div class="container">
        <h1>Mi indicador</h1>
        <p id="UF"></p>
        <p id="DolarO"></p>
        <p id="DolarA"></p>
        <p id="Euro"></p>
        <p id="UTM"></p>

        <h2>Convertir a Pesos Chilenos</h2>
        <label for="monto">Monto:</label>
        <input type="number" id="monto" placeholder="Ingrese monto">
        
        <label for="tipo">Tipo de moneda:</label>
        <select id="tipo">
            <option value="UF">UF</option>
            <option value="Euro">Euro</option>
            <option value="UTM">UTM</option>
        </select>

        <button onclick="convertir()">Calcular</button>
        <p id="resultado"></p>
    </div>

    <script>
        let indicadores = {};

        function fetchIndicators() {
            fetch('https://mindicador.cl/api')
                .then(response => response.json())
                .then(data => {
                    indicadores = {
                        UF: data.uf.valor,
                        DolarO: data.dolar.valor,
                        DolarA: data.dolar_intercambio.valor,
                        Euro: data.euro.valor,
                        UTM: data.utm.valor
                    };

                    document.getElementById("UF").innerHTML = 'El valor actual de la UF es $' + indicadores.UF;
                    document.getElementById("DolarO").innerHTML = 'El valor actual del Dólar observado es $' + indicadores.DolarO;
                    document.getElementById("DolarA").innerHTML = 'El valor actual del Dólar acuerdo es $' + indicadores.DolarA;
                    document.getElementById("Euro").innerHTML = 'El valor actual del Euro es $' + indicadores.Euro;
                    document.getElementById("UTM").innerHTML = 'El valor actual de la UTM es $' + indicadores.UTM;
                })
                .catch(error => console.log('Error al obtener datos', error));
        }

        function convertir() {
            let monto = parseFloat(document.getElementById("monto").value);
            let tipo = document.getElementById("tipo").value;

            if (!monto || !indicadores[tipo]) {
                document.getElementById("resultado").innerHTML = "Ingrese un monto válido.";
                return;
            }

            let resultado = monto * indicadores[tipo];
            document.getElementById("resultado").innerHTML = `El monto en pesos chilenos es: $${resultado.toFixed(2)}`;
        }

        document.addEventListener("DOMContentLoaded", fetchIndicators);
    </script>
