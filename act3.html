    <h1>Calcula tu edad</h1>
    <label for="fechaNacimiento">Fecha de nacimiento:</label>
    <input type="date" id="fechaNacimiento">
    <button onclick="calcularEdad()">Calcular Edad</button>
    <p id="resultado"></p>

    <script>
        function calcularEdad() {
            let fechaNacimiento = document.getElementById("fechaNacimiento").value;
            if (!fechaNacimiento) {
                document.getElementById("resultado").innerText = "Por favor, ingresa tu fecha de nacimiento.";
                return;
            }

            let fechaNac = new Date(fechaNacimiento);
            let hoy = new Date();

            let edad = hoy.getFullYear() - fechaNac.getFullYear();
            let mes = hoy.getMonth() - fechaNac.getMonth();
            let dia = hoy.getDate() - fechaNac.getDate();

            if (mes < 0 || (mes === 0 && dia < 0)) {
                edad--;
            }

            document.getElementById("resultado").innerText = `Tu edad es: ${edad} años.`;
        }
    </script>
</body>
